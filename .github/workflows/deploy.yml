name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          lein: latest

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build backend
        run: cd backend && lein uberjar

      - name: Deploy to VDS
        env:
          SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" frontend/dist/ reframe@$VDS_HOST:/var/www/reframe/dist/
          scp -o StrictHostKeyChecking=no backend/target/reframe.jar reframe@$VDS_HOST:/opt/reframe/
          ssh -o StrictHostKeyChecking=no reframe@$VDS_HOST "sudo systemctl restart reframe-backend"
