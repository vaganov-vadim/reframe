name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .

  frontend-test:
    runs-on: ubuntu-latest
    needs: frontend-lint-types
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: frontend-build
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
      - name: Install Playwright OS deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test
        timeout-minutes: 15

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          lein: latest
      - name: Run tests
        working-directory: backend
        run: lein test

  deploy:
    needs: [frontend-build, backend-test, frontend-e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          lein: latest

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build backend
        run: cd backend && lein uberjar

      - name: Deploy to VDS
        env:
          SSH_KEY: ${{ secrets.VDS_SSH_KEY }}
          VDS_HOST: ${{ secrets.VDS_HOST }}
        run: |
          set -euo pipefail
          JAR=$(ls backend/target/*-standalone.jar | head -1)
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          SSH="ssh -o StrictHostKeyChecking=no reframe@$VDS_HOST"

          rsync -avz -e "ssh -o StrictHostKeyChecking=no" frontend/dist/ "reframe@$VDS_HOST:/var/www/reframe/dist/"
          scp -o StrictHostKeyChecking=no "$JAR" "reframe@$VDS_HOST:/opt/reframe/reframe.jar"

          # Prefer passwordless systemctl for the reframe user (no sudoers needed).
          # Fall back to sudo only if configured; never leave new jar with old process.
          if $SSH 'systemctl --user restart reframe-backend'; then
            echo "Backend restarted via systemctl --user"
          elif $SSH 'sudo -n /bin/systemctl restart reframe-backend'; then
            echo "Backend restarted via sudo -n systemctl"
          elif $SSH 'test -x /opt/reframe/restart.sh && /opt/reframe/restart.sh'; then
            echo "Backend restarted via /opt/reframe/restart.sh"
          else
            echo "::error::Backend jar uploaded but restart failed. Fix VDS sudoers or install /opt/reframe/restart.sh"
            echo "Manual fix: ssh reframe@$VDS_HOST and restart the backend process"
            exit 1
          fi
