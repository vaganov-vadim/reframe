pre-commit:
  parallel: true
  commands:
    typecheck:
      run: npx tsc --noEmit
      root: frontend
    lint:
      run: npx eslint .
      root: frontend

pre-push:
  commands:
    frontend-test:
      run: npx vitest run
      root: frontend
    backend-test:
      run: lein test
      root: backend
